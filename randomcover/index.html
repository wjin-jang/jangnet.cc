<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Cover</title>
    <style>html,body{margin:0;padding:0;height:100%;background:#000;display:flex;align-items:center;justify-content:center}img{max-width:100%;max-height:100vh;display:block}</style>
</head>
<body>
    <img id="c">
    <script>
    Promise.all([
        fetch('/assets/data/vinyls.json').then(function(r){return r.json()}),
        fetch('/assets/data/digital.json').then(function(r){return r.json()})
    ]).then(function(d){
        var a=d[0].concat(d[1]);
        var pick=a[Math.floor(Math.random()*a.length)];
        document.getElementById('c').src='/assets/images/'+pick.img;
    });
    </script>
</body>
</html>
